<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D'chica Production Budget</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a1a; min-height: 100vh; padding: 1.5rem 1rem 3rem; }
  #app { max-width: 700px; margin: 0 auto; }
  .page-title { font-size: 17px; font-weight: 500; }
  .page-sub { font-size: 12px; color: #888; margin-top: 2px; }
  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .section-title { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .04em; margin: 1rem 0 .6rem; }
  .budget-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: .5rem; }
  .budget-card { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 12px 14px; }
  .bc-label { font-size: 11px; font-weight: 500; margin-bottom: 6px; }
  .bc-num { font-size: 17px; font-weight: 500; }
  .bc-spent { font-size: 11px; color: #888; margin-top: 2px; }
  .bc-remaining { font-size: 11px; margin-top: 1px; }
  .bc-pending { font-size: 11px; color: #BA7517; margin-top: 1px; }
  .progress-track { background: #e8e7e3; border-radius: 99px; height: 6px; overflow: hidden; margin-top: 6px; }
  .progress-bar { height: 100%; border-radius: 99px; transition: width .4s; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 0.5px solid #ccc; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; color: #1a1a1a; font-family: inherit; }
  .btn:hover { background: #f5f4f0; }
  .btn-green { background: #E1F5EE; border-color: #1D9E75; color: #085041; }
  .btn-green:hover { background: #c8eddf; }
  .btn-red { background: #FCEBEB; border-color: #E24B4A; color: #A32D2D; }
  .btn-red:hover { background: #f5d5d5; }
  .btn-ghost { background: none; border: none; cursor: pointer; color: #888; padding: 4px; font-size: 13px; font-family: inherit; }
  .btn-ghost:hover { color: #1a1a1a; }
  input[type=text], input[type=number], input[type=date], input[type=password], select, textarea { background: #fff; border: 0.5px solid #ccc; border-radius: 8px; padding: 7px 10px; font-size: 13px; color: #1a1a1a; font-family: inherit; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #7F77DD; box-shadow: 0 0 0 2px #7F77DD22; }
  textarea { width: 100%; resize: vertical; min-height: 60px; }
  .form-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .form-grid2 input, .form-grid2 select { width: 100%; }
  .form-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .form-grid3 input, .form-grid3 select { width: 100%; }
  .form-full { width: 100%; margin-bottom: 8px; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .pill { display: inline-flex; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 500; cursor: pointer; border: 0.5px solid #ddd; background: transparent; color: #888; font-family: inherit; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .entry { background: #fff; border: 0.5px solid #ddd; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .entry-name { font-size: 14px; font-weight: 500; }
  .entry-amount { font-size: 15px; font-weight: 500; }
  .entry-meta { font-size: 12px; color: #888; }
  .entry-badge { font-size: 11px; font-weight: 500; padding: 1px 8px; border-radius: 99px; border-width: 0.5px; border-style: solid; }
  .entry-note { font-size: 12px; color: #888; font-style: italic; }
  .entry-reason { font-size: 12px; color: #A32D2D; margin-top: 6px; padding: 6px 10px; background: #FCEBEB; border-radius: 6px; }
  .entry-actions { display: flex; gap: 8px; margin-top: 10px; }
  .reject-form { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid #eee; }
  .status-pending  { background: #FFF8E6; color: #7A5500; border-color: #F0C040; }
  .status-approved { background: #E1F5EE; color: #085041; border-color: #1D9E75; }
  .status-rejected { background: #FCEBEB; color: #A32D2D; border-color: #F09595; }
  .empty { text-align: center; padding: 2.5rem 0; color: #888; font-size: 14px; }
  .divider { border: none; border-top: 0.5px solid #e5e5e5; margin: 0 0 1rem; }
  .loading { text-align: center; padding: 2rem; color: #888; font-size: 14px; }
  .sync-bar { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888; margin-bottom: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; display: inline-block; flex-shrink: 0; }
  .dot.green { background: #1D9E75; }
  .dot.red { background: #E24B4A; }
  .dot.spin { background: #7F77DD; animation: pulse .8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .pending-count { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: #E24B4A; color: #fff; font-size: 10px; font-weight: 600; margin-left: 6px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f4f0; }
  .login-card { background: #fff; border: 0.5px solid #ddd; border-radius: 16px; padding: 2rem 1.75rem; width: 100%; max-width: 360px; }
  .login-logo { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .login-sub { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
  .login-label { font-size: 12px; color: #888; margin-bottom: 6px; display: block; }
  .login-inp { width: 100%; margin-bottom: 12px; }
  .login-btn { width: 100%; padding: 9px; border-radius: 8px; border: none; background: #7F77DD; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; margin-top: 4px; }
  .login-btn:hover { background: #6b63c9; }
  .login-err { font-size: 12px; color: #A32D2D; margin-top: 8px; text-align: center; }
  .logout-btn { font-size: 11px; color: #888; background: none; border: none; cursor: pointer; font-family: inherit; padding: 0; }
  .logout-btn:hover { color: #1a1a1a; }
  .cb-edit-inp { width: 100%; font-size: 13px; border: 0.5px solid #ccc; border-radius: 6px; padding: 5px 8px; font-family: inherit; margin-top: 4px; }
  .cb-edit-inp:focus { outline: none; border-color: #7F77DD; }
  .cb-actions { display: flex; gap: 6px; margin-top: 6px; }
  .cb-btn { font-size: 11px; padding: 3px 10px; border-radius: 6px; border: 0.5px solid #ccc; background: #fff; cursor: pointer; font-family: inherit; }
  .cb-ghost { background: none; border: none; font-size: 11px; cursor: pointer; color: #888; font-family: inherit; padding: 3px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDRV2V8Vogbtts7sYqSCPrGe-Z1BsezCWdFJQFG5lIbuo2VrY9Sei_U9jMoB9eUmRh/exec";
var PASSWORDS = { purchase: "dchica123", accounts: "accounts456" };

var FABRIC_TYPES = ["Period Panties", "Bras & Camis", "Others"];
var OTHER_CATS = ["Packaging", "Trims", "Finished Product"];
var ALL_BUDGET_KEYS = FABRIC_TYPES.concat(OTHER_CATS);

var CAT_COLOR = {
  "Period Panties":   { fill: "#F5E6FF", stroke: "#9B59B6", text: "#5B2C6F" },
  "Bras & Camis":     { fill: "#EEEDFE", stroke: "#7F77DD", text: "#3C3489" },
  "Others":           { fill: "#F0F0F0", stroke: "#999",    text: "#444" },
  "Packaging":        { fill: "#E1F5EE", stroke: "#1D9E75", text: "#085041" },
  "Trims":            { fill: "#FAEEDA", stroke: "#BA7517", text: "#633806" },
  "Finished Product": { fill: "#FDE8F0", stroke: "#D4537E", text: "#7D1F45" }
};

var fmt = function(n) { return "\u20B9" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 }); };
var pct = function(a, b) { return b > 0 ? Math.min(100, Math.round((a / b) * 100)) : 0; };
var today = function() { return new Date().toISOString().slice(0, 10); };
var emptyBudgets = function() { var b = {}; ALL_BUDGET_KEYS.forEach(function(k) { b[k] = 0; }); return b; };

var state = {
  loggedIn: false, role: null, loginError: "", pwInput: "", roleInput: "purchase",
  data: { budgets: emptyBudgets(), entries: [] },
  loading: false, syncing: false, syncOk: null, error: null,
  showForm: false, filterStatus: "All", filterCat: "All",
  form: { vendor: "", category: "Period Panties", amount: "", date: today(), note: "" },
  rejectingId: null, rejectReason: "", editingBudget: null, budgetInput: ""
};

function setState(patch) { for (var k in patch) { state[k] = patch[k]; } render(); }

function api(payload, cb) {
  fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) })
    .then(function(r) { return r.json(); })
    .then(function(j) { if (j.error) throw new Error(j.error); cb(null, j); })
    .catch(function(e) { cb(e); });
}

function loadData() {
  setState({ loading: true, error: null });
  api({ action: "get" }, function(err, j) {
    if (err) { setState({ loading: false, syncOk: false, error: err.message }); return; }
    var budgets = emptyBudgets();
    if (j.data && j.data.budgets) {
      Object.keys(j.data.budgets).forEach(function(k) { if (budgets[k] !== undefined) budgets[k] = Number(j.data.budgets[k]) || 0; });
    }
    setState({ data: { budgets: budgets, entries: (j.data && j.data.entries) || [] }, loading: false, syncOk: true });
  });
}

function el(tag, attrs) {
  var e = document.createElement(tag);
  var children = Array.prototype.slice.call(arguments, 2);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      var v = attrs[k];
      if (k === "style" && typeof v === "object") { Object.assign(e.style, v); }
      else if (k.indexOf("on") === 0) { e.addEventListener(k.slice(2).toLowerCase(), v); }
      else if (k === "className") { e.className = v; }
      else { e.setAttribute(k, v); }
    });
  }
  children.forEach(function(c) {
    if (c == null) return;
    if (Array.isArray(c)) { c.forEach(function(x) { if (x != null) e.appendChild(typeof x === "string" ? document.createTextNode(x) : x); }); }
    else { e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
  });
  return e;
}

function icon(name) { var i = document.createElement("i"); i.className = "ti ti-" + name; return i; }

function progressBar(value, max, color) {
  var p = pct(value, max);
  return el("div", { className: "progress-track" },
    el("div", { className: "progress-bar", style: { width: p + "%", background: p >= 90 ? "#E24B4A" : color } })
  );
}

function budgetCard(key, budget, spent, pend, editable) {
  var col = CAT_COLOR[key] || { fill: "#f0f0f0", stroke: "#aaa", text: "#444" };
  var rem = budget - spent;
  var isEditing = state.editingBudget === key;
  var card = el("div", { className: "budget-card", style: { borderColor: col.stroke } });
  card.appendChild(el("div", { className: "bc-label", style: { color: col.text } }, key));
  if (editable && isEditing) {
    var inp = el("input", { className: "cb-edit-inp", type: "number", placeholder: "e.g. 200000" });
    inp.value = state.budgetInput;
    inp.addEventListener("input", function(e) { state.budgetInput = e.target.value; });
    inp.addEventListener("keydown", function(e) { if (e.key === "Enter") saveBudget(key); });
    setTimeout(function() { inp.focus(); }, 30);
    card.appendChild(inp);
    var acts = el("div", { className: "cb-actions" });
    var kk = key;
    acts.appendChild(el("button", { className: "cb-btn", onClick: function() { saveBudget(kk); } }, "Set"));
    acts.appendChild(el("button", { className: "cb-ghost", onClick: function() { setState({ editingBudget: null }); } }, "Cancel"));
    card.appendChild(acts);
  } else {
    var numRow = el("div", { style: { display: "flex", alignItems: "baseline", gap: "6px" } });
    numRow.appendChild(el("span", { className: "bc-num" }, budget > 0 ? fmt(budget) : "\u2014"));
    if (editable) {
      var kk2 = key, bud2 = budget;
      var eb = el("button", { className: "btn-ghost", style: { padding: "0", fontSize: "12px" }, onClick: function() { setState({ editingBudget: kk2, budgetInput: bud2 || "" }); } });
      eb.appendChild(icon("edit")); numRow.appendChild(eb);
    }
    card.appendChild(numRow);
    if (budget > 0) {
      card.appendChild(el("div", { className: "bc-spent" }, "Approved: " + fmt(spent)));
      if (pend > 0) card.appendChild(el("div", { className: "bc-pending" }, "Pending: " + fmt(pend)));
      card.appendChild(el("div", { className: "bc-remaining", style: { color: rem < 0 ? "#A32D2D" : col.text } }, rem < 0 ? "Over by " + fmt(Math.abs(rem)) : "Left: " + fmt(rem)));
      card.appendChild(progressBar(spent, budget, col.stroke));
    } else {
      card.appendChild(el("div", { className: "bc-spent" }, editable ? "Tap edit to set" : "Not set"));
    }
  }
  return card;
}

function tryLogin() {
  var role = state.roleInput, pw = state.pwInput;
  if (pw === PASSWORDS[role]) { setState({ loggedIn: true, role: role, loginError: "", pwInput: "" }); loadData(); }
  else { setState({ loginError: "Incorrect password. Please try again." }); }
}

function render() {
  var root = document.getElementById("root");
  root.innerHTML = "";
  if (!state.loggedIn) { renderLogin(root); return; }
  var wrap = el("div", { id: "app" });
  root.appendChild(wrap);
  renderApp(wrap);
}

function renderLogin(root) {
  var wrap = el("div", { className: "login-wrap" });
  var card = el("div", { className: "login-card" });
  card.appendChild(el("div", { className: "login-logo" }, "D\u2019chica"));
  card.appendChild(el("div", { className: "login-sub" }, "Production Budget Manager"));
  card.appendChild(el("label", { className: "login-label" }, "I am"));
  var roleSel = el("select", { className: "login-inp" });
  var o1 = el("option", { value: "purchase" }, "Purchase Manager"); var o2 = el("option", { value: "accounts" }, "Accounts");
  if (state.roleInput === "accounts") o2.selected = true;
  roleSel.appendChild(o1); roleSel.appendChild(o2);
  roleSel.addEventListener("change", function(e) { state.roleInput = e.target.value; });
  card.appendChild(roleSel);
  card.appendChild(el("label", { className: "login-label" }, "Password"));
  var pwInp = el("input", { type: "password", placeholder: "Enter your password", className: "login-inp" });
  pwInp.value = state.pwInput;
  pwInp.addEventListener("input", function(e) { state.pwInput = e.target.value; });
  pwInp.addEventListener("keydown", function(e) { if (e.key === "Enter") tryLogin(); });
  setTimeout(function() { pwInp.focus(); }, 50);
  card.appendChild(pwInp);
  card.appendChild(el("button", { className: "login-btn", onClick: tryLogin }, "Sign in"));
  if (state.loginError) card.appendChild(el("div", { className: "login-err" }, state.loginError));
  wrap.appendChild(card); root.appendChild(wrap);
}

function renderApp(app) {
  var data = state.data, role = state.role, showForm = state.showForm,
      filterStatus = state.filterStatus, filterCat = state.filterCat,
      form = state.form, rejectingId = state.rejectingId,
      loading = state.loading, syncing = state.syncing, syncOk = state.syncOk, error = state.error;

  var catApproved = {}, catPending = {};
  ALL_BUDGET_KEYS.forEach(function(k) {
    catApproved[k] = data.entries.filter(function(e) { return e.status === "approved" && e.category === k; }).reduce(function(s, e) { return s + Number(e.amount); }, 0);
    catPending[k]  = data.entries.filter(function(e) { return e.status === "pending"  && e.category === k; }).reduce(function(s, e) { return s + Number(e.amount); }, 0);
  });
  var grandBudget   = ALL_BUDGET_KEYS.reduce(function(s, k) { return s + Number(data.budgets[k] || 0); }, 0);
  var grandApproved = ALL_BUDGET_KEYS.reduce(function(s, k) { return s + catApproved[k]; }, 0);
  var pendingCount  = data.entries.filter(function(e) { return e.status === "pending"; }).length;
  var listEntries = data.entries.filter(function(e) {
    return (filterStatus === "All" || e.status === filterStatus.toLowerCase()) &&
           (filterCat === "All" || e.category === filterCat);
  });

  app.appendChild(el("div", { className: "header-row" },
    el("div", {},
      el("div", { className: "page-title" }, "Production budget"),
      el("div", { className: "page-sub" }, grandBudget > 0 ? "Total " + fmt(grandBudget) + " \u00B7 Approved " + fmt(grandApproved) + " \u00B7 " + pct(grandApproved, grandBudget) + "% used" : "Set budgets below")
    ),
    el("div", { style: { display: "flex", gap: "8px", alignItems: "center" } },
      el("button", { className: "btn-ghost", onClick: loadData }, icon("refresh")),
      el("button", { className: "logout-btn", onClick: function() { setState({ loggedIn: false, role: null, pwInput: "", roleInput: "purchase" }); } }, "Sign out")
    )
  ));

  var dotClass = "dot" + (syncing ? " spin" : syncOk === true ? " green" : syncOk === false ? " red" : "");
  app.appendChild(el("div", { className: "sync-bar" }, el("span", { className: dotClass }),
    syncing ? "Syncing..." : syncOk === true ? "Synced with Google Sheets" : syncOk === false ? "Error: " + (error || "check connection") : "Connecting..."
  ));

  if (loading) { app.appendChild(el("div", { className: "loading" }, "Loading...")); return; }

  var editable = role === "accounts";

  app.appendChild(el("div", { className: "section-title" }, "Fabric"));
  var fg = el("div", { className: "budget-grid" });
  FABRIC_TYPES.forEach(function(k) { fg.appendChild(budgetCard(k, Number(data.budgets[k] || 0), catApproved[k], catPending[k], editable)); });
  app.appendChild(fg);

  app.appendChild(el("div", { className: "section-title" }, "Other Categories"));
  var og = el("div", { className: "budget-grid" });
  OTHER_CATS.forEach(function(k) { og.appendChild(budgetCard(k, Number(data.budgets[k] || 0), catApproved[k], catPending[k], editable)); });
  app.appendChild(og);

  app.appendChild(el("hr", { className: "divider" }));

  if (role === "purchase") {
    app.appendChild(el("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" } },
      el("div", { style: { fontSize: "13px", fontWeight: "500", color: "#888" } }, "Purchase Manager"),
      el("button", { className: "btn", onClick: function() { setState({ showForm: !showForm }); } }, icon("plus"), " New request")
    ));
    if (showForm) {
      var fcard = el("div", { className: "card" });
      fcard.appendChild(el("div", { style: { fontSize: "14px", fontWeight: "500", marginBottom: "12px" } }, "New purchase request"));
      var g1 = el("div", { className: "form-grid2" });
      var vi = el("input", { type: "text", placeholder: "Vendor name" }); vi.value = form.vendor;
      vi.addEventListener("input", function(e) { state.form.vendor = e.target.value; });
      var ai = el("input", { type: "number", placeholder: "Amount" }); ai.value = form.amount;
      ai.addEventListener("input", function(e) { state.form.amount = e.target.value; });
      g1.appendChild(vi); g1.appendChild(ai); fcard.appendChild(g1);
      var g2 = el("div", { className: "form-grid2" });
      var catSel = el("select", {});
      ALL_BUDGET_KEYS.forEach(function(k) { var o = el("option", { value: k }, k); if (k === form.category) o.selected = true; catSel.appendChild(o); });
      catSel.addEventListener("change", function(e) { state.form.category = e.target.value; });
      var di = el("input", { type: "date" }); di.value = form.date;
      di.addEventListener("change", function(e) { state.form.date = e.target.value; });
      g2.appendChild(catSel); g2.appendChild(di); fcard.appendChild(g2);
      var ni = el("input", { type: "text", placeholder: "Note / purpose (optional)", className: "form-full" }); ni.value = form.note;
      ni.addEventListener("input", function(e) { state.form.note = e.target.value; });
      fcard.appendChild(ni);
      var fa = el("div", { className: "form-actions" });
      fa.appendChild(el("button", { className: "btn", onClick: addEntry }, "Submit request"));
      fa.appendChild(el("button", { className: "btn-ghost", onClick: function() { setState({ showForm: false }); } }, "Cancel"));
      fcard.appendChild(fa); app.appendChild(fcard);
    }
    app.appendChild(el("div", { style: { fontSize: "13px", fontWeight: "500", marginBottom: "10px", color: "#888" } }, "Your requests"));
  }

  if (role === "accounts") {
    app.appendChild(el("div", { style: { fontSize: "13px", fontWeight: "500", marginBottom: "12px", color: "#888" } },
      "Accounts" + (pendingCount > 0 ? " \u00B7 " + pendingCount + " pending approval" : "")
    ));
  }

  var sp = el("div", { className: "pills" });
  ["All", "Pending", "Approved", "Rejected"].forEach(function(s) {
    var active = filterStatus === s, sv = s;
    var p = el("button", { className: "pill", style: { borderColor: active ? "#7F77DD" : "#ddd", background: active ? "#EEEDFE" : "transparent", color: active ? "#3C3489" : "#888" }, onClick: function() { setState({ filterStatus: sv }); } }, s);
    if (s === "Pending" && pendingCount > 0) p.appendChild(el("span", { className: "pending-count", style: { marginLeft: "4px" } }, String(pendingCount)));
    sp.appendChild(p);
  });
  app.appendChild(sp);

  var cp = el("div", { className: "pills" });
  ["All"].concat(ALL_BUDGET_KEYS).forEach(function(k) {
    var active = filterCat === k, kv = k, col = CAT_COLOR[k] || {};
    cp.appendChild(el("button", { className: "pill", style: { borderColor: active ? (col.stroke || "#aaa") : "#ddd", background: active ? (col.fill || "#eee") : "transparent", color: active ? (col.text || "#333") : "#888" }, onClick: function() { setState({ filterCat: kv }); } }, k));
  });
  app.appendChild(cp);

  renderEntries(listEntries, role, rejectingId, app, catApproved, data.budgets);
}

function renderEntries(entries, role, rejectingId, app, catApproved, budgets) {
  if (entries.length === 0) { app.appendChild(el("div", { className: "empty" }, "No entries to show.")); return; }
  entries.forEach(function(entry) {
    var card = el("div", { className: "entry" });
    var left = el("div", { style: { flex: "1", minWidth: "0" } });
    var nameRow = el("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "4px", flexWrap: "wrap" } });
    nameRow.appendChild(el("span", { className: "entry-name" }, entry.vendor));
    var col = CAT_COLOR[entry.category] || { fill: "#eee", stroke: "#aaa", text: "#444" };
    nameRow.appendChild(el("span", { className: "entry-badge", style: { background: col.fill, color: col.text, borderColor: col.stroke } }, entry.category));
    var st = entry.status || "pending";
    nameRow.appendChild(el("span", { className: "entry-badge status-" + st }, st.charAt(0).toUpperCase() + st.slice(1)));
    left.appendChild(nameRow);
    var meta = el("div", { style: { display: "flex", gap: "12px", alignItems: "center", flexWrap: "wrap" } });
    meta.appendChild(el("span", { className: "entry-amount" }, fmt(entry.amount)));
    var ds = el("span", { className: "entry-meta" }); ds.appendChild(icon("calendar")); ds.appendChild(document.createTextNode(" " + entry.date));
    meta.appendChild(ds);
    if (entry.note) meta.appendChild(el("span", { className: "entry-note" }, entry.note));
    left.appendChild(meta);
    if (role === "accounts" && st === "pending") {
      var budget = Number(budgets[entry.category] || 0), approvedSoFar = catApproved[entry.category] || 0, after = approvedSoFar + Number(entry.amount);
      if (budget > 0) {
        var exceed = after > budget;
        left.appendChild(el("div", { style: { fontSize: "11px", marginTop: "4px", color: exceed ? "#A32D2D" : "#0F6E56" } },
          exceed ? "Approving will exceed " + entry.category + " budget by " + fmt(after - budget) : "Within budget - " + fmt(budget - after) + " remaining after approval"
        ));
      }
    }
    card.appendChild(left);
    if (st === "rejected" && entry.rejectReason) card.appendChild(el("div", { className: "entry-reason" }, "Rejected: " + entry.rejectReason));
    if (role === "accounts" && st === "pending") {
      if (rejectingId === entry.id) {
        var rf = el("div", { className: "reject-form" });
        rf.appendChild(el("div", { style: { fontSize: "12px", color: "#888", marginBottom: "6px" } }, "Reason for rejection:"));
        var rta = el("textarea", { placeholder: "e.g. Budget exceeded, duplicate request..." }); rta.value = state.rejectReason;
        rta.addEventListener("input", function(ev) { state.rejectReason = ev.target.value; });
        rf.appendChild(rta);
        var racts = el("div", { className: "form-actions", style: { marginTop: "8px" } });
        var eid = entry.id;
        racts.appendChild(el("button", { className: "btn btn-red", onClick: function() { confirmReject(eid); } }, "Confirm rejection"));
        racts.appendChild(el("button", { className: "btn-ghost", onClick: function() { setState({ rejectingId: null, rejectReason: "" }); } }, "Cancel"));
        rf.appendChild(racts); card.appendChild(rf);
      } else {
        var acts = el("div", { className: "entry-actions" }), eid2 = entry.id;
        acts.appendChild(el("button", { className: "btn btn-green", onClick: function() { approveEntry(eid2); } }, icon("check"), " Approve"));
        acts.appendChild(el("button", { className: "btn btn-red", onClick: function() { setState({ rejectingId: eid2, rejectReason: "" }); } }, icon("x"), " Reject"));
        card.appendChild(acts);
      }
    }
    app.appendChild(card);
  });
}

function saveBudget(key) {
  var b = parseFloat(state.budgetInput);
  if (isNaN(b) || b <= 0) { setState({ editingBudget: null }); return; }
  setState({ syncing: true });
  api({ action: "setBudget", cat: key, amount: b }, function(err) {
    if (err) { setState({ syncing: false, syncOk: false, error: err.message }); return; }
    loadData(); setState({ syncing: false, syncOk: true, editingBudget: null });
  });
}

function addEntry() {
  var form = state.form;
  if (!form.vendor.trim() || !form.amount || isNaN(parseFloat(form.amount))) return;
  var entry = { id: Date.now(), vendor: form.vendor, category: form.category, amount: parseFloat(form.amount), date: form.date, note: form.note || "", status: "pending", rejectReason: "" };
  setState({ syncing: true, showForm: false, form: { vendor: "", category: "Period Panties", amount: "", date: today(), note: "" } });
  api({ action: "addEntry", entry: entry }, function(err) {
    if (err) { setState({ syncing: false, syncOk: false, error: err.message }); return; }
    loadData(); setState({ syncing: false, syncOk: true });
  });
}

function approveEntry(id) {
  setState({ syncing: true });
  api({ action: "updateStatus", id: id, status: "approved", rejectReason: "" }, function(err) {
    if (err) { setState({ syncing: false, syncOk: false, error: err.message }); return; }
    loadData(); setState({ syncing: false, syncOk: true });
  });
}

function confirmReject(id) {
  var reason = state.rejectReason.trim();
  if (!reason) { alert("Please enter a reason for rejection."); return; }
  setState({ syncing: true, rejectingId: null, rejectReason: "" });
  api({ action: "updateStatus", id: id, status: "rejected", rejectReason: reason }, function(err) {
    if (err) { setState({ syncing: false, syncOk: false, error: err.message }); return; }
    loadData(); setState({ syncing: false, syncOk: true });
  });
}

render();
</script>
</body>
</html>
