<style>

.dot.green { background: #1D9E75; } .dot.red { background: #E24B4A; } .dot.spin { background: #7F77DD; animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

<body>
<div id="root"></div>
<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDRV2V8Vogbtts7sYqSCPrGe-Z1BsezCWdFJQFG5lIbuo2VrY9Sei_U9jMoB9eUmRh/exec";
var PASSWORDS = { purchase: "dchica123", accounts: "accounts456" };
var FABRIC_KEYS = ["Period Panties","Bras & Camis","Others"];
var OTHER_KEYS  = ["Packaging","Trims","Finished Product","Cash Purchase","Tailor Payments"];
var MCF_KEYS    = ["MCF Period Panties","MCF Bras & Camis","MCF Finished Goods","MCF Others"];
var ALL_KEYS    = FABRIC_KEYS.concat(OTHER_KEYS).concat(MCF_KEYS);
var CAT_COLOR = {
  "Period Panties":     {fill:"#F5E6FF",stroke:"#9B59B6",text:"#5B2C6F"},
  "Bras & Camis":       {fill:"#EEEDFE",stroke:"#7F77DD",text:"#3C3489"},
  "Others":             {fill:"#F0F0F0",stroke:"#999",text:"#444"},
  "Packaging":          {fill:"#E1F5EE",stroke:"#1D9E75",text:"#085041"},
  "Trims":              {fill:"#FAEEDA",stroke:"#BA7517",text:"#633806"},
  "Finished Product":   {fill:"#FDE8F0",stroke:"#D4537E",text:"#7D1F45"},
  "Cash Purchase":      {fill:"#E8F4FF",stroke:"#2980B9",text:"#1A5276"},
  "Tailor Payments":    {fill:"#F0FFF4",stroke:"#27AE60",text:"#145A32"},
  "MCF Period Panties": {fill:"#FFF0E0",stroke:"#E67E22",text:"#784212"},
  "MCF Bras & Camis":   {fill:"#E8F8FF",stroke:"#2E86C1",text:"#1A5276"},
  "MCF Finished Goods": {fill:"#F0FFF0",stroke:"#27AE60",text:"#145A32"},
  "MCF Others":         {fill:"#FFF5F5",stroke:"#E74C3C",text:"#922B21"}
};
var CAL_MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var fmt = function(n){return "\u20B9"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});};
var pct = function(a,b){return b>0?Math.min(100,Math.round((a/b)*100)):0;};
var today = function(){return new Date().toISOString().slice(0,10);};

function currentMonthYear(){var d=new Date();return {month:CAL_MONTHS[d.getMonth()],year:d.getFullYear()};}
function getFY(month,year){var idx=CAL_MONTHS.indexOf(month);if(idx>=3)return "FY "+year+"-"+String(year+1).slice(2);else return "FY "+(year-1)+"-"+String(year).slice(2);}
function monthKey(month,year){var idx=CAL_MONTHS.indexOf(month);return year+"-"+String(idx+1).padStart(2,"0");}
function parseMonthKey(mk){
  if(!mk)return null;
  var n=mk.match(/^(\d{4})-(\d{2})$/);
  if(n)return {month:CAL_MONTHS[parseInt(n[2])-1],year:parseInt(n[1])};
  var o=mk.match(/^([A-Za-z]+)-(\d{4})$/);
  if(o)return {month:o[1],year:parseInt(o[2])};
  return null;
}
function normaliseKey(mk){
  if(!mk||mk.trim()===""||mk==="0")return "";
  if(/^\d{4}-\d{2}$/.test(mk))return mk;
  var o=mk.match(/^([A-Za-z]+)-(\d{4})$/);
  if(o){var idx=CAL_MONTHS.indexOf(o[1]);if(idx>=0)return o[2]+"-"+String(idx+1).padStart(2,"0");}
  var d=mk.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(d)return d[3]+"-"+String(parseInt(d[1])).padStart(2,"0");
  return mk;
}
function getEntryMonthKey(entry){
  if(entry.monthKey&&entry.monthKey.trim()!==""&&entry.monthKey!=="0"){var n=normaliseKey(entry.monthKey.trim());if(n)return n;}
  if(entry.date){var d=new Date(entry.date);if(!isNaN(d.getTime()))return monthKey(CAL_MONTHS[d.getMonth()],d.getFullYear());}
  var c=currentMonthYear();return monthKey(c.month,c.year);
}

var cur=currentMonthYear();
var state={
  loggedIn:false,role:null,loginError:"",pwInput:"",roleInput:"purchase",
  data:{budgets:{},entries:[]},
  loading:false,syncing:false,syncOk:null,error:null,
  activeTab:"budget",showForm:false,filterStatus:"All",filterCat:"All",
  form:{vendor:"",category:"Period Panties",amount:"",date:today(),note:""},
  rejectingId:null,rejectReason:"",editingBudget:null,budgetInput:"",
  selMonth:cur.month,selYear:cur.year
};

function setState(patch){for(var k in patch){state[k]=patch[k];}render();}
function api(payload,cb){
  fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(j){if(j.error)throw new Error(j.error);cb(null,j);})
    .catch(function(e){cb(e);});
}
function loadData(){
  setState({loading:true,error:null});
  api({action:"get"},function(err,j){
    if(err){setState({loading:false,syncOk:false,error:err.message});return;}
    setState({data:j.data||{budgets:{},entries:[]},loading:false,syncOk:true});
  });
}
function getBudgetsForMonth(month,year){
  var key=monthKey(month,year),result={};
  var b=state.data.budgets[key]||state.data.budgets[month+"-"+year]||{};
  ALL_KEYS.forEach(function(k){result[k]=Number(b[k]||0);});
  return result;
}
function getPrevMonthBudgets(month,year){
  var idx=CAL_MONTHS.indexOf(month),pm,py;
  if(idx===0){pm=CAL_MONTHS[11];py=year-1;}else{pm=CAL_MONTHS[idx-1];py=year;}
  return getBudgetsForMonth(pm,py);
}
function el(tag,attrs){
  var e=document.createElement(tag);var ch=Array.prototype.slice.call(arguments,2);
  if(attrs){Object.keys(attrs).forEach(function(k){var v=attrs[k];if(k==="style"&&typeof v==="object"){Object.assign(e.style,v);}else if(k.indexOf("on")===0){e.addEventListener(k.slice(2).toLowerCase(),v);}else if(k==="className"){e.className=v;}else{e.setAttribute(k,v);}});}
  ch.forEach(function(c){if(c==null)return;if(Array.isArray(c)){c.forEach(function(x){if(x!=null)e.appendChild(typeof x==="string"?document.createTextNode(x):x);});}else{e.appendChild(typeof c==="string"?document.createTextNode(c):c);}});
  return e;
}
function icon(name){var i=document.createElement("i");i.className="ti ti-"+name;return i;}
function progressBar(value,max,color){var p=pct(value,max);return el("div",{className:"progress-track"},el("div",{className:"progress-bar",style:{width:p+"%",background:p>=90?"#E24B4A":color}}));}

function budgetCard(key,budget,spent,pend,editable,month,year){
  var col=CAT_COLOR[key]||{fill:"#f0f0f0",stroke:"#aaa",text:"#444"},rem=budget-spent,ek=key+"|"+month+"|"+year,isEd=state.editingBudget===ek;
  var card=el("div",{className:"budget-card",style:{borderColor:col.stroke}});
  card.appendChild(el("div",{className:"bc-label",style:{color:col.text}},key));
  if(editable&&isEd){
    var inp=el("input",{className:"cb-edit-inp",type:"number",placeholder:"Amount"});inp.value=state.budgetInput;
    inp.addEventListener("input",function(e){state.budgetInput=e.target.value;});
    var kk=key,mm=month,yy=year;inp.addEventListener("keydown",function(e){if(e.key==="Enter")saveBudget(kk,mm,yy);});
    setTimeout(function(){inp.focus();},30);card.appendChild(inp);
    var acts=el("div",{className:"cb-actions"});
    acts.appendChild(el("button",{className:"cb-btn",onClick:function(){saveBudget(kk,mm,yy);}},"Set"));
    acts.appendChild(el("button",{className:"cb-ghost",onClick:function(){setState({editingBudget:null});}},"Cancel"));
    card.appendChild(acts);
  }else{
    var nr=el("div",{style:{display:"flex",alignItems:"baseline",gap:"4px"}});
    nr.appendChild(el("span",{className:"bc-num"},budget>0?fmt(budget):"\u2014"));
    if(editable){var kk2=key,mm2=month,yy2=year,b2=budget,ek2=ek;var eb=el("button",{className:"btn-ghost",style:{padding:"0",fontSize:"11px"},onClick:function(){setState({editingBudget:ek2,budgetInput:b2||""});}});eb.appendChild(icon("edit"));nr.appendChild(eb);}
    card.appendChild(nr);
    if(budget>0){
      card.appendChild(el("div",{className:"bc-spent"},"Approved: "+fmt(spent)));
      if(pend>0)card.appendChild(el("div",{className:"bc-pending"},"Pending: "+fmt(pend)));
      card.appendChild(el("div",{className:"bc-remaining",style:{color:rem<0?"#A32D2D":col.text}},rem<0?"Over "+fmt(Math.abs(rem)):"Left: "+fmt(rem)));
      card.appendChild(progressBar(spent,budget,col.stroke));
    }else{card.appendChild(el("div",{className:"bc-spent"},editable?"Tap \u270E to set":"Not set"));}
  }
  return card;
}

function tryLogin(){var role=state.roleInput,pw=state.pwInput;if(pw===PASSWORDS[role]){setState({loggedIn:true,role:role,loginError:"",pwInput:""});loadData();}else{setState({loginError:"Incorrect password. Please try again."});}}
function render(){var root=document.getElementById("root");root.innerHTML="";if(!state.loggedIn){renderLogin(root);return;}var wrap=el("div",{id:"app"});root.appendChild(wrap);renderApp(wrap);}

function renderLogin(root){
  var wrap=el("div",{className:"login-wrap"}),card=el("div",{className:"login-card"});
  card.appendChild(el("div",{className:"login-logo"},"D\u2019chica"));
  card.appendChild(el("div",{className:"login-sub"},"Production Budget Manager"));
  card.appendChild(el("label",{className:"login-label"},"I am"));
  var rs=el("select",{className:"login-inp"}),o1=el("option",{value:"purchase"},"Purchase Manager"),o2=el("option",{value:"accounts"},"Accounts");
  if(state.roleInput==="accounts")o2.selected=true;rs.appendChild(o1);rs.appendChild(o2);
  rs.addEventListener("change",function(e){state.roleInput=e.target.value;});
  card.appendChild(rs);card.appendChild(el("label",{className:"login-label"},"Password"));
  var pw=el("input",{type:"password",placeholder:"Enter your password",className:"login-inp"});pw.value=state.pwInput;
  pw.addEventListener("input",function(e){state.pwInput=e.target.value;});

  setTimeout(function(){pw.focus();},50);card.appendChild(pw);
  card.appendChild(el("button",{className:"login-btn",onClick:tryLogin},"Sign in"));

function renderApp(app){
  var data=state.data,role=state.role,showForm=state.showForm,filterStatus=state.filterStatus,filterCat=state.filterCat,form=state.form,rejectingId=state.rejectingId,loading=state.loading,syncing=state.syncing,syncOk=state.syncOk,error=state.error,selMonth=state.selMonth,selYear=state.selYear,activeTab=state.activeTab;
  var mkey=monthKey(selMonth,selYear),budgets=getBudgetsForMonth(selMonth,selYear);
  var hasAny=ALL_KEYS.some(function(k){return budgets[k]>0;}),prevB=getPrevMonthBudgets(selMonth,selYear),prevHas=ALL_KEYS.some(function(k){return prevB[k]>0;});
  var me=(data.entries||[]).filter(function(e){return getEntryMonthKey(e)===mkey;});
  var ca={},cp={};
  ALL_KEYS.forEach(function(k){
    ca[k]=me.filter(function(e){return e.status==="approved"&&e.category===k;}).reduce(function(s,e){return s+Number(e.amount);},0);
    cp[k]=me.filter(function(e){return e.status==="pending"&&e.category===k;}).reduce(function(s,e){return s+Number(e.amount);},0);
  });
  var gb=ALL_KEYS.reduce(function(s,k){return s+budgets[k];},0),ga=ALL_KEYS.reduce(function(s,k){return s+ca[k];},0);
  var pc=me.filter(function(e){return e.status==="pending";}).length;
  var le=me.filter(function(e){return(filterStatus==="All"||e.status===filterStatus.toLowerCase())&&(filterCat==="All"||e.category===filterCat);});

  app.appendChild(el("div",{className:"header-row"},
    el("div",{},el("div",{className:"page-title"},"Production budget"),el("div",{className:"page-sub"},gb>0?"Allocated: "+fmt(gb)+" \u00B7 Approved: "+fmt(ga)+" \u00B7 "+pct(ga,gb)+"% used":selMonth+" "+selYear+" \u00B7 No budgets set")),
    el("div",{style:{display:"flex",gap:"8px",alignItems:"center"}},el("button",{className:"btn-ghost",onClick:loadData},icon("refresh")),el("button",{className:"logout-btn",onClick:function(){setState({loggedIn:false,role:null,pwInput:"",roleInput:"purchase"});}},"Sign out"))
  ));
  var dc="dot"+(syncing?" spin":syncOk===true?" green":syncOk===false?" red":"");
  app.appendChild(el("div",{className:"sync-bar"},el("span",{className:dc}),syncing?"Syncing...":syncOk===true?"Synced":syncOk===false?"Error: "+(error||"check"):"Connecting..."));
  if(loading){app.appendChild(el("div",{className:"loading"},"Loading..."));return;}

  var mb=el("div",{className:"month-bar"});mb.appendChild(el("span",{className:"month-label"},"Viewing:"));

  if(role==="accounts"&&!hasAny&&prevHas){

  var ed=role==="accounts";
  app.appendChild(el("div",{className:"section-title"},"Fabric"));
  var fg=el("div",{className:"budget-grid"});FABRIC_KEYS.forEach(function(k){fg.appendChild(budgetCard(k,budgets[k],ca[k],cp[k],ed,selMonth,selYear));});app.appendChild(fg);
  app.appendChild(el("div",{className:"section-title"},"Other Categories"));
  var og=el("div",{className:"budget-grid"});["Packaging","Trims","Finished Product"].forEach(function(k){og.appendChild(budgetCard(k,budgets[k],ca[k],cp[k],ed,selMonth,selYear));});app.appendChild(og);
  var og2=el("div",{className:"budget-grid-2"});["Cash Purchase","Tailor Payments"].forEach(function(k){og2.appendChild(budgetCard(k,budgets[k],ca[k],cp[k],ed,selMonth,selYear));});app.appendChild(og2);
  app.appendChild(el("div",{className:"section-title"},"MCF (Additional Budget)"));

  // ── Month summary table ──────────────────────────────────────────────────
  app.appendChild(el("div",{className:"month-summary-title"},selMonth+" "+selYear+" \u2014 Summary"));
  var mswrap=el("div",{className:"msummary-wrap"});
  var mst=el("table",{className:"msummary-table"});
  var msth=el("tr",{});
  ["Category","Allocated","Approved","Pending","Remaining","% Used"].forEach(function(h){msth.appendChild(el("th",{},h));});
  mst.appendChild(el("thead",{},msth));
  var mstb=el("tbody",{});
  var secs=[{label:"FABRIC",keys:FABRIC_KEYS},{label:"OTHER CATEGORIES",keys:OTHER_KEYS},{label:"MCF",keys:MCF_KEYS}];
  var gtA=0,gtAp=0,gtP=0;
  secs.forEach(function(sec){
    var sr=el("tr",{className:"sec-row"});var std=el("td",{colspan:"6"},sec.label);sr.appendChild(std);mstb.appendChild(sr);
    sec.keys.forEach(function(k){
      var alloc=budgets[k],appr=ca[k],pend=cp[k],rem=alloc-appr;
      gtA+=alloc;gtAp+=appr;gtP+=pend;
      var tr=el("tr",{});
      var col=CAT_COLOR[k]||{stroke:"#aaa"};
      var ctd=el("td",{});
      ctd.appendChild(el("span",{style:{display:"inline-block",width:"7px",height:"7px",borderRadius:"50%",background:col.stroke,marginRight:"6px",verticalAlign:"middle"}}));
      ctd.appendChild(document.createTextNode(k));
      tr.appendChild(ctd);
      tr.appendChild(el("td",{},alloc>0?fmt(alloc):"\u2014"));
      tr.appendChild(el("td",{style:{color:"#085041"}},appr>0?fmt(appr):"\u2014"));
      tr.appendChild(el("td",{style:{color:"#7A5500"}},pend>0?fmt(pend):"\u2014"));
      tr.appendChild(el("td",{className:alloc>0?(rem<0?"over":"ok"):""},alloc>0?(rem<0?"\u25BC "+fmt(Math.abs(rem)):fmt(rem)):"\u2014"));
      tr.appendChild(el("td",{},alloc>0?pct(appr,alloc)+"%":"\u2014"));
      mstb.appendChild(tr);
    });
  });
  var gtr=el("tr",{className:"total-row"});
  var gtRem=gtA-gtAp;
  gtr.appendChild(el("td",{},"TOTAL"));
  gtr.appendChild(el("td",{},fmt(gtA)));
  gtr.appendChild(el("td",{style:{color:"#085041"}},fmt(gtAp)));
  gtr.appendChild(el("td",{style:{color:"#7A5500"}},fmt(gtP)));
  gtr.appendChild(el("td",{className:gtRem<0?"over":"ok"},gtRem<0?"\u25BC "+fmt(Math.abs(gtRem)):fmt(gtRem)));
  gtr.appendChild(el("td",{},pct(gtAp,gtA)+"%"));
  mstb.appendChild(gtr);
  mst.appendChild(mstb);mswrap.appendChild(mst);app.appendChild(mswrap);
  // ────────────────────────────────────────────────────────────────────────

  app.appendChild(el("hr",{className:"divider"}));

  if(role==="purchase"){
    app.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}},
      el("div",{style:{fontSize:"13px",fontWeight:"500",color:"#888"}},"Purchase Manager \u00B7 "+selMonth+" "+selYear),
      el("button",{className:"btn",onClick:function(){setState({showForm:!showForm});}},icon("plus")," New request")
    ));
    if(showForm){
      var fc=el("div",{style:{background:"#fff",border:"0.5px solid #ddd",borderRadius:"12px",padding:"1rem 1.25rem",marginBottom:"1rem"}});
      fc.appendChild(el("div",{style:{fontSize:"14px",fontWeight:"500",marginBottom:"12px"}},"New purchase request"));
      var g1=el("div",{className:"form-grid2"});
      var vi=el("input",{type:"text",placeholder:"Vendor name"});vi.value=form.vendor;vi.addEventListener("input",function(e){state.form.vendor=e.target.value;});
      var ai=el("input",{type:"number",placeholder:"Amount"});ai.value=form.amount;ai.addEventListener("input",function(e){state.form.amount=e.target.value;});
      g1.appendChild(vi);g1.appendChild(ai);fc.appendChild(g1);
      var g2=el("div",{className:"form-grid2"});
      var cs=el("select",{});ALL_KEYS.forEach(function(k){var o=el("option",{value:k},k);if(k===form.category)o.selected=true;cs.appendChild(o);});cs.addEventListener("change",function(e){state.form.category=e.target.value;});
      var di=el("input",{type:"date"});di.value=form.date;di.addEventListener("change",function(e){state.form.date=e.target.value;});
      g2.appendChild(cs);g2.appendChild(di);fc.appendChild(g2);
      var ni=el("input",{type:"text",placeholder:"Note / purpose (optional)",className:"form-full"});ni.value=form.note;ni.addEventListener("input",function(e){state.form.note=e.target.value;});fc.appendChild(ni);
      var fa=el("div",{className:"form-actions"});
      fa.appendChild(el("button",{className:"btn",onClick:addEntry},"Submit request"));

      fc.appendChild(fa);app.appendChild(fc);
    }
    app.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"500",marginBottom:"10px",color:"#888"}},"Requests for "+selMonth+" "+selYear));
  }
  if(role==="accounts"){app.appendChild(el("div",{style:{fontSize:"13px",fontWeight:"500",marginBottom:"10px",color:"#888"}},"Accounts \u00B7 "+selMonth+" "+selYear+(pc>0?" \u00B7 "+pc+" pending":"")));}

  var sp=el("div",{className:"pills"});
  ["All","Pending","Approved","Rejected"].forEach(function(s){var act=filterStatus===s,sv=s;var p=el("button",{className:"pill",style:{borderColor:act?"#7F77DD":"#ddd",background:act?"#EEEDFE":"transparent",color:act?"#3C3489":"#888"},onClick:function(){setState({filterStatus:sv});}},s);if(s==="Pending"&&pc>0)p.appendChild(el("span",{className:"pending-count",style:{marginLeft:"4px"}},String(pc)));sp.appendChild(p);});
  app.appendChild(sp);
  var cpills=el("div",{className:"pills"});
  ["All"].concat(ALL_KEYS).forEach(function(k){var act=filterCat===k,kv=k,col=CAT_COLOR[k]||{};cpills.appendChild(el("button",{className:"pill",style:{borderColor:act?(col.stroke||"#aaa"):"#ddd",background:act?(col.fill||"#eee"):"transparent",color:act?(col.text||"#333"):"#888"},onClick:function(){setState({filterCat:kv});}},k));});
  app.appendChild(cpills);
  renderEntries(le,role,rejectingId,app,ca,budgets);
}

function renderSummary(app){
  var data=state.data,ae=data.entries||[],ms={};
  Object.keys(data.budgets||{}).forEach(function(k){var nk=normaliseKey(k);if(nk)ms[nk]=true;});
  ae.forEach(function(e){var nk=getEntryMonthKey(e);if(nk)ms[nk]=true;});
  var mks=Object.keys(ms).sort(function(a,b){
    var pa=parseMonthKey(a),pb=parseMonthKey(b);if(!pa||!pb)return 0;
    var am=CAL_MONTHS.indexOf(pa.month),bm=CAL_MONTHS.indexOf(pb.month);
    if(pa.year!==pb.year)return pa.year-pb.year;return am-bm;
  });
  if(mks.length===0){app.appendChild(el("div",{className:"empty"},"No monthly data yet."));return;}

  var secs=[{label:"FABRIC",keys:FABRIC_KEYS},{label:"OTHER CATEGORIES",keys:OTHER_KEYS},{label:"MCF",keys:MCF_KEYS}];
  var wrap=el("div",{className:"summary-wrap"});
  var tbl=el("table",{className:"summary-table"});

  // Header row
  var thRow=el("tr",{});
  thRow.appendChild(el("th",{},"Category"));
  mks.forEach(function(mk){var p=parseMonthKey(mk);thRow.appendChild(el("th",{},p?p.month.slice(0,3)+" "+String(p.year).slice(2):mk));});
  thRow.appendChild(el("th",{},"Total"));
  tbl.appendChild(el("thead",{},thRow));
  var tbody=el("tbody",{});

  // Grand total accumulators per month
  var gtAlloc=new Array(mks.length).fill(0);
  var gtAppr=new Array(mks.length).fill(0);
  var gtTotalAlloc=0,gtTotalAppr=0;

  secs.forEach(function(sec){
    var sr=el("tr",{className:"sec-header"});
    sr.appendChild(el("td",{colspan:String(mks.length+2)},sec.label));
    tbody.appendChild(sr);
    sec.keys.forEach(function(k){
      var tr=el("tr",{});
      var col=CAT_COLOR[k]||{stroke:"#aaa"};
      var ctd=el("td",{});
      ctd.appendChild(el("span",{style:{display:"inline-block",width:"7px",height:"7px",borderRadius:"50%",background:col.stroke,marginRight:"5px",verticalAlign:"middle"}}));
      ctd.appendChild(document.createTextNode(k));
      tr.appendChild(ctd);
      var rowA=0,rowAp=0;
      mks.forEach(function(mk,mi){
        var nk=normaliseKey(mk)||mk;
        var bd=data.budgets[nk]||data.budgets[mk]||{};
        var alloc=Number(bd[k]||0);
        var appr=ae.filter(function(e){return getEntryMonthKey(e)===nk&&e.category===k&&e.status==="approved";}).reduce(function(s,e){return s+Number(e.amount);},0);
        rowA+=alloc;rowAp+=appr;gtAlloc[mi]+=alloc;gtAppr[mi]+=appr;
        var td=el("td",{});
        if(alloc>0||appr>0){
          td.appendChild(el("div",{className:"num",style:{fontWeight:"600"}},alloc>0?fmt(alloc):"\u2014"));
          td.appendChild(el("div",{className:"num",style:{color:"#888"}},"Appr: "+fmt(appr)));
          var rem=alloc-appr;
          td.appendChild(el("div",{className:"num "+(rem<0?"over":"ok")},(rem<0?"\u25BC ":"\u25B2 ")+fmt(Math.abs(rem))));
        }else{td.appendChild(el("div",{style:{color:"#ccc"}},"\u2014"));}
        tr.appendChild(td);
      });
      gtTotalAlloc+=rowA;gtTotalAppr+=rowAp;
      var tt=el("td",{});
      tt.appendChild(el("div",{className:"num",style:{fontWeight:"600"}},rowA>0?fmt(rowA):"\u2014"));
      tt.appendChild(el("div",{className:"num",style:{color:"#888"}},"Appr: "+fmt(rowAp)));
      var rr=rowA-rowAp;
      tt.appendChild(el("div",{className:"num "+(rr<0?"over":"ok")},(rr<0?"\u25BC ":"\u25B2 ")+fmt(Math.abs(rr))));
      tr.appendChild(tt);tbody.appendChild(tr);
    });
  });

  // Grand total row
  var gtr=el("tr",{className:"total-row"});gtr.appendChild(el("td",{},"GRAND TOTAL"));
  mks.forEach(function(mk,mi){
    var td=el("td",{});
    td.appendChild(el("div",{className:"num"},fmt(gtAlloc[mi])));
    td.appendChild(el("div",{className:"num",style:{color:"#888"}},"Appr: "+fmt(gtAppr[mi])));
    var r=gtAlloc[mi]-gtAppr[mi];
    td.appendChild(el("div",{className:"num "+(r<0?"over":"ok")},(r<0?"\u25BC ":"\u25B2 ")+fmt(Math.abs(r))));
    gtr.appendChild(td);
  });
  var gtt=el("td",{});
  gtt.appendChild(el("div",{className:"num"},fmt(gtTotalAlloc)));
  gtt.appendChild(el("div",{className:"num",style:{color:"#888"}},"Appr: "+fmt(gtTotalAppr)));
  var gr=gtTotalAlloc-gtTotalAppr;
  gtt.appendChild(el("div",{className:"num "+(gr<0?"over":"ok")},(gr<0?"\u25BC ":"\u25B2 ")+fmt(Math.abs(gr))));
  gtr.appendChild(gtt);tbody.appendChild(gtr);
  tbl.appendChild(tbody);wrap.appendChild(tbl);app.appendChild(wrap);
}

function renderEntries(entries,role,rejectingId,app,ca,budgets){
  if(entries.length===0){app.appendChild(el("div",{className:"empty"},"No entries to show."));return;}
  entries.forEach(function(e){
    var card=el("div",{className:"entry"}),left=el("div",{style:{flex:"1",minWidth:"0"}});
    var nr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px",flexWrap:"wrap"}});
    nr.appendChild(el("span",{className:"entry-name"},e.vendor));
    var col=CAT_COLOR[e.category]||{fill:"#eee",stroke:"#aaa",text:"#444"};
    nr.appendChild(el("span",{className:"entry-badge",style:{background:col.fill,color:col.text,borderColor:col.stroke}},e.category));
    var st=e.status||"pending";
    nr.appendChild(el("span",{className:"entry-badge status-"+st},st.charAt(0).toUpperCase()+st.slice(1)));
    left.appendChild(nr);
    var meta=el("div",{style:{display:"flex",gap:"12px",alignItems:"center",flexWrap:"wrap"}});
    meta.appendChild(el("span",{className:"entry-amount"},fmt(e.amount)));
    var ds=el("span",{className:"entry-meta"});ds.appendChild(icon("calendar"));ds.appendChild(document.createTextNode(" "+e.date));meta.appendChild(ds);
    if(e.note)meta.appendChild(el("span",{className:"entry-note"},e.note));
    left.appendChild(meta);
    if(role==="accounts"&&st==="pending"){
      var b=Number(budgets[e.category]||0),af=ca[e.category]||0,aft=af+Number(e.amount);
      if(b>0){var ex=aft>b;left.appendChild(el("div",{style:{fontSize:"11px",marginTop:"4px",color:ex?"#A32D2D":"#0F6E56"}},ex?"Approving will exceed "+e.category+" budget by "+fmt(aft-b):"Within budget \u2014 "+fmt(b-aft)+" remaining"));}
    }
    card.appendChild(left);
    if(st==="rejected"&&e.rejectReason)card.appendChild(el("div",{className:"entry-reason"},"Rejected: "+e.rejectReason));
    if(role==="accounts"){
      if(st==="pending"){
        if(rejectingId===e.id){
          var rf=el("div",{className:"reject-form"});
          rf.appendChild(el("div",{style:{fontSize:"12px",color:"#888",marginBottom:"6px"}},"Reason for rejection:"));
          var rta=el("textarea",{placeholder:"e.g. Budget exceeded..."});rta.value=state.rejectReason;
          rta.addEventListener("input",function(ev){state.rejectReason=ev.target.value;});rf.appendChild(rta);
          var ra=el("div",{className:"form-actions",style:{marginTop:"8px"}}),eid=e.id;
          ra.appendChild(el("button",{className:"btn btn-red",onClick:function(){confirmReject(eid);}},"Confirm rejection"));
          ra.appendChild(el("button",{className:"btn-ghost",onClick:function(){setState({rejectingId:null,rejectReason:""});}},"Cancel"));
          rf.appendChild(ra);card.appendChild(rf);
        }else{
          var acts=el("div",{className:"entry-actions"}),eid2=e.id;
          acts.appendChild(el("button",{className:"btn btn-green",onClick:function(){approveEntry(eid2);}},icon("check")," Approve"));
          acts.appendChild(el("button",{className:"btn btn-red",onClick:function(){setState({rejectingId:eid2,rejectReason:""});}},icon("x")," Reject"));
          card.appendChild(acts);
        }
      }else if(st==="approved"){
        var ua=el("div",{className:"entry-actions"}),eid3=e.id;
        ua.appendChild(el("button",{className:"btn btn-amber",onClick:function(){if(confirm("Move this back to Pending?"))undoStatus(eid3);}},icon("arrow-back-up")," Undo Approval"));
        card.appendChild(ua);
      }else if(st==="rejected"){
        var ur=el("div",{className:"entry-actions"}),eid4=e.id;
        ur.appendChild(el("button",{className:"btn btn-amber",onClick:function(){if(confirm("Move this back to Pending?"))undoStatus(eid4);}},icon("arrow-back-up")," Undo Rejection"));
        card.appendChild(ur);
      }
    }
    app.appendChild(card);
  });
}

function saveBudget(key,month,year){var b=parseFloat(state.budgetInput);if(isNaN(b)||b<0){setState({editingBudget:null});return;}setState({syncing:true});api({action:"setBudget",cat:key,amount:b,month:month,year:year},function(err){if(err){setState({syncing:false,syncOk:false,error:err.message});return;}loadData();setState({syncing:false,syncOk:true,editingBudget:null});});}
function carryForward(){var sm=state.selMonth,sy=state.selYear,prev=getPrevMonthBudgets(sm,sy);setState({syncing:true});api({action:"carryForward",month:sm,year:sy,budgets:prev},function(err){if(err){setState({syncing:false,syncOk:false,error:err.message});return;}loadData();setState({syncing:false,syncOk:true});});}
function addEntry(){var form=state.form,mk=monthKey(state.selMonth,state.selYear);if(!form.vendor.trim()||!form.amount||isNaN(parseFloat(form.amount)))return;var entry={id:Date.now(),vendor:form.vendor,category:form.category,amount:parseFloat(form.amount),date:form.date,note:form.note||"",status:"pending",rejectReason:"",monthKey:mk};setState({syncing:true,showForm:false,form:{vendor:"",category:"Period Panties",amount:"",date:today(),note:""}});api({action:"addEntry",entry:entry},function(err){if(err){setState({syncing:false,syncOk:false,error:err.message});return;}loadData();setState({syncing:false,syncOk:true});});}
function approveEntry(id){setState({syncing:true});api({action:"updateStatus",id:id,status:"approved",rejectReason:""},function(err){if(err){setState({syncing:false,syncOk:false,error:err.message});return;}loadData();setState({syncing:false,syncOk:true});});}
function confirmReject(id){var r=state.rejectReason.trim();if(!r){alert("Please enter a reason.");return;}setState({syncing:true,rejectingId:null,rejectReason:""});api({action:"updateStatus",id:id,status:"rejected",rejectReason:r},function(err){if(err){setState({syncing:false,syncOk:false,error:err.message});return;}loadData();setState({syncing:false,syncOk:true});});}
function undoStatus(id){setState({syncing:true});api({action:"updateStatus",id:id,status:"pending",rejectReason:""},function(err){if(err){setState({syncing:false,syncOk:false,error:err.message});return;}loadData();setState({syncing:false,syncOk:true});});}
render();
</script>
